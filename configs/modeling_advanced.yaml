# =====================================================================
# CHF — Advanced ML sophistication layer (OPTIONAL, default OFF)
# =====================================================================
# This file is NOT loaded by the canonical pipeline. ModelAgent/LabelAgent
# merge it ONLY when the operator opts in, so `python main.py model
# --config configs/run_config.yaml` stays byte-identical and reproducible
# without it. Opt in with either:
#
#   CHF_MODELING_ADVANCED=1 .venv/bin/python main.py model --config configs/run_config.yaml
#
# or by setting `modeling.load_advanced_config: true` in run_config.yaml
# (not done — run_config.yaml is intentionally left untouched).
#
# When loaded, the `modeling_advanced` block is shallow-merged onto the
# `modeling` config and `extra_model_names` are appended to model_names
# (CLI --models still wins). Tests exercise every knob by setting
# cfg['modeling'] directly and never read this file.
# ---------------------------------------------------------------------

modeling_advanced:
  enabled: true

  # Appended to modeling.model_names (deduped). The two new gradient-boosters
  # and the walk-forward stacking ensemble. Existing ridge/rf/lightgbm keep
  # running so their Rank IC is a directly comparable baseline.
  extra_model_names:
    - xgboost
    - catboost
    - stacked_ensemble

  # ---- new base learners (crypto-sane defaults) ----
  xgboost:
    n_estimators: 400
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 5.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    gamma: 0.0
    objective: "reg:squarederror"
    tree_method: "hist"
    n_jobs: -1
    verbosity: 0

  catboost:
    iterations: 400
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3.0
    subsample: 0.8
    loss_function: "RMSE"
    thread_count: -1

  # ---- walk-forward stacking ensemble (model_name "stacked_ensemble") ----
  # Inside each outer fold: base models are trained on the train slice, an
  # INNER purged walk-forward produces out-of-fold base predictions, a ridge
  # meta-learner is fit on those OOF preds (train-only), then base models are
  # refit on the full train slice to predict the test slice. No test-window
  # leakage: base + meta are both fit strictly on train rows.
  stacking:
    base_models: [linear_ridge, random_forest, lightgbm, xgboost, catboost]
    meta_learner: ridge          # "ridge" or "nnls" (non-negative least squares)
    meta_alpha: 1.0
    meta_positive: false         # ridge>=0 coefficients (nnls is always >=0)
    inner_holdout_frac: 0.7      # fallback single-holdout split point if WF yields none
    inner_walk_forward:
      # Coarse inner folds keep the full-grid cost tractable (fewer base-model
      # refits per outer fold) while still giving a real OOF meta-fit.
      test_days: 90
      step_days: 90
      embargo_days: 0
      min_train_rows: 1
      min_test_rows: 1
      min_test_symbols: 1

  # ---- regime-conditional models (EXPERIMENTAL, default OFF) ----
  # Within each fold, train a separate model per regime label on that regime's
  # train rows; predict each test row with its date's regime model (fallback to
  # an all-train model when a regime has too few train rows). Records which
  # regime model produced each prediction in the `regime_model` column.
  regime_conditional:
    enabled: false
    regime_path: "data/strategies/regime_daily.parquet"
    min_regime_train_rows: 300

  # ---- meta-labeling second stage (EXPERIMENTAL, default OFF) ----
  # After the primary model produces a side, a binary meta-model (predict_proba)
  # is trained INSIDE each fold on train-only meta-labels (was the primary side
  # correct on the realized train return?) with |return| sample weights; p_meta
  # sizes the primary signal on the test slice. Records `meta_prob` +
  # `primary_prediction`. Fully walk-forward-safe.
  meta_labeling:
    enabled: false
    meta_model: logistic         # "logistic" | "random_forest" | "lightgbm"
    threshold: 0.0               # 0.0 = pure sizing (primary * p_meta); >0 also gates
    C: 1.0
    max_iter: 1000

# ---------------------------------------------------------------------
# LabelAgent triple-barrier reference (docs/LABELING.md §3a). LabelAgent
# reads `labels.label_type`/`labels.triple_barrier` from run_config.yaml;
# this block documents the shape and is NOT auto-merged (labels config is
# owned by run_config.yaml, left untouched). To try triple-barrier labels,
# copy `triple_barrier` under `labels:` and set label_type: triple_barrier.
# ---------------------------------------------------------------------
labels_advanced:
  label_type: triple_barrier
  triple_barrier:
    pt_sl: [1.0, 1.0]            # [take-profit, stop-loss] sigma multipliers
    vertical_barrier_days: 14    # time barrier; drives recommended_embargo_days
    vol_lookback: 100            # EWMA span for get_daily_vol
