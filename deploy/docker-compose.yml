# Project CHF continuous scheduler stack.
#
# Usage:
#   cp .env.example .env      # then fill in SMTP_* / WEBHOOK_URL / API keys
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f scheduler
#
# The build context is the repo root (..), so the Dockerfile can COPY the code.
services:
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chf-scheduler:latest
    container_name: chf-scheduler
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: "UTC"
    volumes:
      # Persist pipeline outputs and scheduler logs on the host.
      - ../data:/app/data
      - ../logs:/app/logs
    # Keep container logs bounded so a long-running fund does not fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

